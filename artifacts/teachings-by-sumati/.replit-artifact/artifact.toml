kind = "web"
previewPath = "/"
title = "Teachings By Sumati"
version = "1.0.0"
id = "artifacts/teachings-by-sumati"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19477

[services.development]
run = "pnpm --filter @workspace/teachings-by-sumati run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teachings-by-sumati", "run", "build" ]
publicDir = "artifacts/teachings-by-sumati/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19477"
BASE_PATH = "/"
